<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>農地写真アーカイブ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
:root{--g:#1b4332;--g2:#2d6a4f;--a:#d97706;--bd:#dbdbdb;--tx:#0f172a;--bg:#fafafa;--sf:#fff;--mut:#737373;--hd:#1b4332}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--sf:#1e293b;--bd:#334155;--tx:#e2e8f0;--mut:#94a3b8;--g:#6ee7b7;--g2:#34d399}}
:root[data-theme=dark]{--bg:#0f172a;--sf:#1e293b;--bd:#334155;--tx:#e2e8f0;--mut:#94a3b8;--g:#6ee7b7;--g2:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);user-select:none}
button,select{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit;user-select:text}
.hidden{display:none!important}
body.role-viewer .edit-only{display:none!important}

header{height:48px;min-height:48px;flex-shrink:0;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;z-index:30}
header h1{font-size:16px;margin:0;white-space:nowrap}
.hb{height:30px;padding:0 9px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.hb.on{background:var(--a);border-color:var(--a);color:#fff}
.hb.role-viewer{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.pill{font-size:12px;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:99px;white-space:nowrap}

main{flex:1 1 auto;display:flex;position:relative;overflow:hidden;min-height:0;width:100%}
#map-section{flex:1;position:relative;overflow:hidden;background:#cbd5e1;min-width:0}
#map-viewport{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#map-viewport.draw{cursor:crosshair}
#layer{position:absolute;left:0;top:0;width:1281px;height:1117px;transform-origin:0 0;will-change:transform}
#layer img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
#svg{position:absolute;inset:0;width:100%;height:100%}
.poly{fill:#ffffff;fill-opacity:1;stroke:rgba(27,67,50,.75);stroke-width:1.8;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:all;transition:fill .15s,stroke .15s}
.poly.custom,.poly.custom.has{fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:2.2}
.poly:hover,.poly.has:hover,.poly.custom:hover,.poly.custom.has:hover,
.poly.touch-hit,.poly.custom.touch-hit{fill:#e8c49e!important;fill-opacity:1!important;stroke:#d97706!important;stroke-width:2.6!important}
.poly.sel,.poly.has.sel,.poly.custom.sel,.poly.custom.has.sel{fill:#dfb088!important;fill-opacity:1!important;stroke:#c2410c!important;stroke-width:3.5!important}
.adj .poly,.adj .poly.has{fill:#ffffff;fill-opacity:1;stroke:#dc2626;stroke-width:1}
.adj .poly.custom{fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1.6}
.adj .poly.sel{fill:#e8c49e!important;fill-opacity:1!important;stroke:#ea580c!important;stroke-width:1.5!important}
.fl{position:absolute;z-index:10;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hint{top:10px;left:10px;padding:7px 11px;font-size:12px;pointer-events:none}
#zoom{bottom:14px;left:10px;display:flex;flex-direction:column;padding:4px;gap:2px}
#zoom button{width:38px;height:38px;border:0;background:none;border-radius:8px;font-size:18px;font-weight:700;color:var(--tx)}
#zoom button:active{background:var(--bd)}
#draw-banner{top:10px;left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:9px 12px;display:flex;gap:10px;align-items:center;max-width:94%;font-size:12px;border:0}
#draw-banner button{border:0;border-radius:8px;padding:6px 10px;font-weight:700;background:#fff;color:#b45309}
#adj-panel{top:10px;right:10px;width:248px;padding:11px;font-size:12px;max-height:calc(100% - 20px);overflow:auto;z-index:20}
#adj-panel h3{margin:0 0 6px;font-size:13px}
#adj-panel .sec{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
#adj-panel .adj-fold-btn{display:none}

@media(max-width:767px){
  body.adj-active main{flex-direction:column}
  body.adj-active #map-section{flex:1 1 auto;min-height:0}
  body.adj-active #zoom{display:flex!important;bottom:8px;left:8px;transform:scale(0.88);transform-origin:bottom left}
  #adj-panel.adj-mobile-dock{
    position:relative!important;top:auto!important;right:auto!important;left:auto!important;bottom:auto!important;
    width:100%!important;max-width:100%!important;max-height:none!important;height:auto!important;
    flex:0 0 auto;z-index:22;border-radius:12px 12px 0 0;border-left:0;border-right:0;border-bottom:0;
    border-top:1px solid var(--bd);box-shadow:0 -4px 16px rgba(0,0,0,.14);padding:8px 10px 10px;font-size:11px;overflow:visible;
  }
  #adj-panel.adj-mobile-dock .adj-fold-btn{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--bd);background:var(--sf);font-size:11px;font-weight:700;color:var(--tx)}
  #adj-panel.adj-mobile-dock .adj-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
  #adj-panel.adj-mobile-dock .adj-head h3{margin:0;font-size:12px}
  #adj-panel.adj-mobile-dock .adj-subhint{margin-top:3px;font-size:10px;line-height:1.3}
  #adj-panel.adj-mobile-dock .adj-ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}
  #adj-panel.adj-mobile-dock .adj-sections{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd)}
  #adj-panel.adj-mobile-dock .sec{border-top:0;padding-top:0;margin-top:0}
  #adj-panel.adj-mobile-dock .sec h3{font-size:11px;margin:0 0 3px}
  #adj-panel.adj-mobile-dock .row{gap:3px;margin:3px 0}
  #adj-panel.adj-mobile-dock .ab{height:28px;font-size:11px;border-radius:6px}
  #adj-panel.adj-mobile-dock .adj-sec-copy{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:5px;border-top:1px dashed var(--bd)}
  #adj-panel.adj-mobile-dock .adj-sec-copy .row{margin:0;flex:0 0 auto}
  #adj-panel.adj-mobile-dock .adj-sec-copy .ab.wide{height:26px;padding:0 10px}
  #adj-panel.adj-mobile-dock.collapsed .adj-body{display:none!important}
}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:5px 0}
.ab{height:34px;border:1px solid var(--bd);background:var(--bg);border-radius:8px;font-size:12px;font-weight:700;color:var(--tx)}
.ab:active{background:var(--a);color:#fff}
.ab.wide{grid-column:1/-1}
.mut{color:var(--mut);font-size:11px;line-height:1.5}
#upload{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.btn{border:0;border-radius:10px;background:var(--g2);color:#fff;font-weight:700;padding:10px 16px}
#menu{position:absolute;right:0;top:38px;width:230px;padding:6px 0;z-index:60;color:var(--tx)}
#menu button,#menu label{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:0;font-size:13px;cursor:pointer}
#menu button:hover,#menu label:hover{background:var(--bg)}

aside{width:52%;background:var(--sf);border-left:1px solid var(--bd);display:flex;flex-direction:column;z-index:20;min-height:0}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--mut)}
#active{flex:1;display:flex;flex-direction:column;min-height:0}
.nb{height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--bd);background:var(--sf);font-size:11px;font-weight:700}

#active .top-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bd);background:var(--bg);min-width:0;flex-shrink:0}
.bar{flex:1;min-width:0;display:flex;gap:8px}
.id-pair{display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.pcode-badge{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 9px;border-radius:7px;background:var(--g);color:#fff;font-size:12px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
:root[data-theme=dark] .pcode-badge{color:#0f172a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pcode-badge{color:#0f172a}}
.pcount-badge{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 9px;border-radius:7px;background:var(--sf);border:1px solid var(--bd);color:var(--tx);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.fld{border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:3px 9px;min-width:0;display:flex;flex-direction:column;justify-content:center;transition:border-color .15s ease,box-shadow .15s ease}
.fld-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fld label{display:block;font-size:10px;font-weight:700;line-height:1.15;color:var(--mut);white-space:nowrap}
.crop-multi-hint{font-size:9px;font-weight:700;color:var(--g2);background:rgba(45,106,79,.1);padding:1px 5px;border-radius:4px;white-space:nowrap}
.fld input{width:100%;min-width:0;border:0;outline:0;background:none;font-weight:700;font-size:14px;line-height:1.25;padding:0}
.fld input[readonly]{color:var(--tx);cursor:default}
.fld:focus-within{border-color:var(--g2);box-shadow:0 0 0 2px rgba(45,106,79,.12)}
body.role-viewer .fld:focus-within{border-color:var(--bd);box-shadow:none}

.crop-strip{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-top:2px}
.crop-chip{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:11px;font-weight:700;line-height:1;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.crop-chip:hover{border-color:var(--g2)}
.crop-chip.on{background:var(--g2);border-color:var(--g2);color:#fff}
:root[data-theme=dark] .crop-chip.on{color:#0f172a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .crop-chip.on{color:#0f172a}}

.addrow{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.addrow label.btn.circle-add{width:42px;height:42px;min-width:42px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(27,67,50,.22)}

@media(min-width:768px){
  #active .top-controls{padding:10px 14px;gap:12px;align-items:flex-start}
  .bar{flex-direction:row;align-items:flex-start;gap:10px}
  .bar-row1{display:flex;align-items:center;gap:8px;flex:0 1 250px;min-width:195px}
  .bar-row1 .fld-lot{flex:1 1 auto;min-width:96px}
  .bar-row2{display:flex;flex-direction:column;gap:5px;flex:1 1 220px;min-width:160px}
  .bar-row2 .fld-crop{width:100%}
  .addrow{margin-left:auto;align-self:center}
}

@media(max-width:767px){
  #active .top-controls{padding:7px 10px;gap:8px;align-items:center}
  .bar{flex:1;min-width:0;flex-direction:column;gap:5px}
  .bar-row1{display:flex;align-items:center;gap:6px;width:100%;min-width:0}
  .pcode-badge{height:26px;padding:0 7px;font-size:11px}
  .pcount-badge{height:26px;padding:0 7px;font-size:11px}
  .bar-row1 .fld-lot{flex:1 1 auto;min-width:0;padding:2px 7px}
  .bar-row2{display:flex;flex-direction:column;gap:4px;width:100%;min-width:0}
  .bar-row2 .fld-crop{width:100%;padding:2px 7px}
  .fld label{font-size:9px;line-height:1.1}
  .fld input,.cp-input-row input,#adj-panel select{font-size:16px!important;line-height:1.25}
  .crop-chip{height:21px;padding:0 7px;font-size:10px}
  .addrow{align-self:center;padding:0 1px}
  .addrow label.btn.circle-add{width:40px;height:40px;min-width:40px;font-size:22px}
}

.card .ch{flex-wrap:wrap;row-gap:3px}
.card-crop-btn{display:inline-flex;align-items:center;gap:3px;height:20px;max-width:100%;padding:0 6px;border-radius:4px;border:none;background:rgba(27,67,50,.86);color:#fff;font-size:10px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.card-crop-btn.unset{background:rgba(255,255,255,.82);color:#334155;font-weight:600}
.card-crop-btn.warn{background:#dc2626;color:#fff;box-shadow:0 0 0 1.5px #fef08a}
.card-crop-static{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:rgba(27,67,50,.82);color:#fff;font-size:10px;font-weight:700;line-height:1;white-space:nowrap}
.card.has-crop-warn{box-shadow:inset 0 0 0 2px #dc2626}
.card-warn-banner{position:absolute;top:0;left:0;right:0;z-index:4;background:rgba(220,38,38,.92);color:#fff;font-size:10px;font-weight:700;line-height:1.25;padding:3px 6px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer}
.card-warn-banner span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#crop-picker{position:fixed;z-index:85;width:min(300px,calc(100vw - 24px));background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:12px;font-size:12px}
#crop-picker h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.cp-chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 8px}
.cp-chip{height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);font-size:12px;font-weight:700}
.cp-chip.on{background:var(--g2);border-color:var(--g2);color:#fff}
.cp-input-row{display:flex;gap:5px;margin-top:6px}
.cp-input-row input{flex:1;min-width:0;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:0 8px;font-size:12px;font-weight:700}
.cp-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.cp-act{height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);font-size:11px;font-weight:700}
.cp-act.primary{background:var(--g2);border-color:var(--g2);color:#fff}
.cp-act.danger{color:#dc2626}

#feed{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;overscroll-behavior-y:none;padding:10px;display:grid;grid-template-columns:1fr;grid-auto-rows:max-content;gap:12px;background:var(--bg);align-content:start}
.card{position:relative;overflow:hidden;background:var(--sf);display:block;border-radius:10px;border:1px solid var(--bd)}
.card img{width:100%;aspect-ratio:4 / 3;object-fit:cover;min-height:0;display:block;cursor:zoom-in;background:rgba(148,163,184,.12);opacity:0;transition:opacity .22s ease}
@media(max-width:767px){
  .card .mob-hide-btn{display:none!important}
}
@media(min-width:768px){
  #feed{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
  .card{border-radius:8px;border:1px solid var(--bd)}
  .card img{aspect-ratio:4 / 3}
}
.card .ch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:6px;gap:4px;background:linear-gradient(to top,rgba(15,23,42,.68),rgba(15,23,42,0));pointer-events:none}
.card .ch > div{pointer-events:auto}
.tag{font-size:10px;font-weight:500;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.85);color:#334155;margin-right:2px}
.tag.old{background:rgba(15,23,42,.55);color:#f1f5f9}
.card img.loaded{opacity:1}
.card-date{border:none;background:rgba(255,255,255,.85);color:#1e293b;border-radius:4px;padding:0 5px;font-family:"Noto Sans JP",system-ui,sans-serif;font-size:10px!important;font-weight:600!important;line-height:20px!important;height:20px;min-height:20px;max-height:20px;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;box-sizing:border-box}
@media(max-width:767px){.card-date-wrap{display:none!important}}
@media(min-width:768px){
  .card-date{display:none!important}
  .card-date-wrap{display:inline-flex;align-items:center;background:rgba(255,255,255,.88);color:#1e293b;border-radius:4px;padding:0 4px;height:20px;font-family:"Noto Sans JP",system-ui,sans-serif;font-size:10px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;gap:0}
  .card-date-wrap span,.card-date-wrap input{font-family:"Noto Sans JP",system-ui,sans-serif!important;font-size:10px!important;font-weight:600!important;line-height:16px!important;font-variant-numeric:tabular-nums;color:#1e293b}
  .card-date-wrap input{border:none;background:transparent;padding:0;text-align:center;outline:none;height:16px;border-radius:2px}
  .card-date-wrap input:focus{background:#fef08a;color:#0f172a}
  .card-date-wrap span{display:inline-flex;align-items:center;justify-content:center;width:6px;opacity:.75}
  .card-date-wrap input.dy{width:26px;padding:0;margin:0}
  .card-date-wrap input.dm,.card-date-wrap input.dd{width:11px;padding:0;margin:0}
}
.card-date.no-exif,.card-date-wrap.no-exif{box-shadow:0 0 0 1.5px #ea580c;background:rgba(255,247,237,.95)}
.card .ch .nb{height:22px;padding:0 6px;font-size:10px;font-weight:700;background:rgba(255,255,255,.9);color:#0f172a;border:none;border-radius:4px}

/* フィード: PCはグリッド/フィード切替式（グリッド4列・画面幅ギリギリ）、スマホはグリッド→タップでフィード（右スワイプでグリッドへ戻る） */
#insta-feed-view{
  position:absolute;inset:0;z-index:25;background:var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;overscroll-behavior-y:none;
  padding:0 0 32px;
}
.feed-pc-bar{
  position:sticky;top:0;z-index:12;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd);
}
.feed-mode-btn{
  height:30px;padding:0 16px;border-radius:99px;
  border:1px solid var(--bd);background:var(--bg);color:var(--tx);
  font-size:12px;font-weight:700;
}
.feed-mode-btn.on{
  background:var(--g2);border-color:var(--g2);color:#fff;
}
:root[data-theme=dark] .feed-mode-btn.on{color:#0f172a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .feed-mode-btn.on{color:#0f172a}}

.feed-mob-bar{
  position:sticky;top:0;z-index:12;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd);
  font-size:12px;font-weight:700;
}
.feed-mob-back{
  border:1px solid var(--bd);background:var(--bg);color:var(--tx);
  border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;
}

@media(max-width:767px){
  .feed-pc-bar{display:none!important}
}
@media(min-width:768px){
  .feed-mob-bar{display:none!important}
}

.ig-grid{
  width:100%;max-width:none;margin:0;
  display:grid;gap:2px;
}
@media(max-width:767px){
  .ig-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5px}
  .ig-grid-item{aspect-ratio:3 / 4}
}
@media(min-width:768px){
  .ig-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
  .ig-grid-item{aspect-ratio:1 / 1}
}
.ig-grid-item{position:relative;overflow:hidden;background:#0f172a;cursor:pointer;border-radius:0}
.ig-grid-item img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s ease}
.ig-grid-item img.loaded{opacity:1}
.ig-grid-meta{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:4px 6px;
  background:linear-gradient(to top,rgba(15,23,42,.82),rgba(15,23,42,0));
  color:#fff;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
  pointer-events:none;
}
.ig-grid-num{
  background:rgba(15,23,42,.75);
  padding:1px 5px;border-radius:4px;line-height:1.25;
}
.ig-grid-date{
  background:rgba(255,255,255,.92);color:#0f172a;
  padding:1px 5px;border-radius:4px;line-height:1.25;white-space:nowrap;
}

.ig-stream{width:100%;max-width:540px;margin:12px auto 0;display:flex;flex-direction:column;gap:14px}

  .ig-stream{max-width:100%;margin:0;gap:0}
}
.ig-post{width:100%;background:var(--sf);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);overflow:hidden}
@media(min-width:768px){
  .ig-post{border:1px solid var(--bd);border-radius:12px}
}
.ig-post-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--sf)}
.ig-author{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.ig-avatar{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
:root[data-theme=dark] .ig-avatar{color:#0f172a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .ig-avatar{color:#0f172a}}
.ig-author-meta{min-width:0;flex:1}
.ig-author-line1{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.25}
.ig-code-inline{font-size:12px;font-weight:700;color:var(--g2);font-variant-numeric:tabular-nums;flex-shrink:0}
.ig-lot{font-size:13px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-crop-line2{margin-top:1px;font-size:11px;font-weight:500;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-hd-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ig-post-date{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.ig-detail-btn{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.ig-photo-wrap{width:100%;margin:0;padding:0;background:#0f172a;display:block;cursor:zoom-in}
.ig-photo-wrap img{width:100%;aspect-ratio:4 / 5;object-fit:cover;display:block;opacity:0;transition:opacity .22s ease}
@media(min-width:768px){
  .ig-photo-wrap img{aspect-ratio:4 / 3}
}
.ig-photo-wrap img.loaded{opacity:1}
.ig-caption-area{padding:10px 12px 13px;background:var(--sf)}
.ig-caption-view{font-size:13.5px;line-height:1.5;color:var(--tx);word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;cursor:text}
.ig-caption-view.is-empty{color:var(--mut);font-size:13px}
.ig-caption-view.is-readonly{cursor:default}
.ig-more-link{display:inline;border:0;background:none;padding:0;margin:0;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer}
.ig-caption-input{width:100%;min-height:42px;border:0;outline:0;background:transparent;color:var(--tx);padding:0;margin:0;font-size:13.5px;line-height:1.5;resize:none;display:block;overflow:hidden}
@media(max-width:767px){.ig-caption-input{font-size:16px}}

/* ◯ 最新: 日付ごとにまとめて大きめのパネルで表示 */
#circle-view{position:absolute;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 32px}
.c-wrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.c-panel-tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
.c-day-entries{display:flex;flex-direction:column;gap:8px}

.c-day-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.c-photo-box{position:relative;border-radius:10px;overflow:hidden;background:#0f172a;aspect-ratio:4 / 3;cursor:zoom-in}

.c-photo-cap{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;background:linear-gradient(to top,rgba(15,23,42,.78),rgba(15,23,42,0));color:#fff;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* 日誌（写真なしでも作成・編集・削除可能） */
#journal-view{position:absolute;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 32px}
.j-wrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.j-editor{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

.j-item{position:relative;background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--g2);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:6px}

.j-date-stamp{font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.j-work-box{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;line-height:1.5;white-space:pre-wrap}
.j-cap{font-size:12.5px;color:var(--mut);line-height:1.5;white-space:pre-wrap}
.j-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:2px}

/* 計画・資料 */
#plans-view{position:absolute;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 32px}
.pl-wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pl-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pl-card h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-form .full{grid-column:1/-1}
.pl-form input,.pl-form select,.pl-form textarea{width:100%;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:7px 9px;font-size:12px}
.pl-form textarea{min-height:58px;resize:vertical}
.pl-file-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pl-file-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px dashed var(--g2);background:rgba(45,106,79,.08);color:var(--g2);font-size:12px;font-weight:700;cursor:pointer}
.pl-file-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);font-size:11px;font-weight:700}

.pl-inline-viewer{margin-top:6px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--bg)}

.pl-sheet-tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:var(--sf);border-bottom:1px solid var(--bd)}
.pl-sheet-tab{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);font-size:11px;font-weight:700;white-space:nowrap}
.pl-sheet-tab.on{background:var(--g2);border-color:var(--g2);color:#fff}
.pl-table-wrap{max-height:65vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--sf)}
.pl-table-wrap table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.pl-table-wrap td,.pl-table-wrap th{border:1px solid var(--bd);padding:5px 8px;white-space:nowrap;text-align:left}
.pl-table-wrap tr:first-child td{background:rgba(45,106,79,.1);font-weight:700}

#detail-modal{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.dm-box{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:520px;width:100%;max-height:90dvh;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.dm-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dm-head h3{margin:0;font-size:15px}

.dm-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mut)}
.dm-field{display:flex;flex-direction:column;gap:4px}
.dm-field label{font-size:11px;font-weight:700;color:var(--mut)}
.dm-field textarea,.dm-field input{width:100%;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:13px;line-height:1.5}

.dm-ro{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-wrap;min-height:42px}

nav#bottom-nav{
  flex-shrink:0;
  width:100%;
  min-height:calc(48px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--sf);
  border-top:1px solid var(--bd);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:60;
}
.bnav-btn{
  border:0;
  background:none;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--mut);
  padding:0;
  transition:color .15s ease,transform .1s ease;
}
.bnav-btn:active{transform:scale(.92)}

.circle-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;font-size:0}
.bnav-btn.on{color:var(--tx)}

@media(min-width:768px){
  .bnav-btn{gap:5px;font-size:12px;font-weight:600}
  .bnav-btn::after{content:attr(data-label)}
}

#lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.95);display:flex;flex-direction:column;color:#fff;opacity:1;transition:opacity .38s ease,transform .38s ease}

.lb-pwrap{position:relative;display:inline-flex;align-items:center}
#lb-pbtn{height:32px;padding:0 10px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
#lb-pbtn.active{background:var(--a);border-color:var(--a)}
#lb-pmenu{position:absolute;right:0;top:38px;min-width:136px;background:#1e293b;border:1px solid rgba(255,255,255,.22);border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.55);padding:4px 0;z-index:100}
#lb-pmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 14px;border:0;background:none;color:#f8fafc;font-size:13px;text-align:left;white-space:nowrap}
#lb-pmenu button:hover,#lb-pmenu button.on{background:rgba(255,255,255,.12);color:#fbbf24;font-weight:700}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0f172ae6;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
#confirm{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}

body.layout-sheet aside{position:fixed;left:0;right:0;top:0;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:100%;height:auto;max-height:none;border-radius:0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .28s;padding-top:env(safe-area-inset-top,0px);z-index:50}

  header{padding:0 8px;gap:4px}
  header h1{font-size:14px}
  header > div{gap:4px!important}
  .hb{padding:0 7px;font-size:11px;height:30px}
  .pill,#zoom,#empty{display:none!important}
  aside{position:fixed;left:0;right:0;top:0;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:100%;height:auto;max-height:none;border-radius:0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .28s;padding-top:env(safe-area-inset-top,0px);z-index:50}
  aside.open{transform:none}

}
