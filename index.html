<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>農地写真アーカイブ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1b4332;--g2:#2d6a4f;--a:#d97706;--bd:#e2e8f0;--tx:#0f172a;--bg:#f8fafc;--sf:#fff;--mut:#64748b;--hd:#1b4332}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--sf:#1e293b;--bd:#334155;--tx:#e2e8f0;--mut:#94a3b8;--g:#6ee7b7;--g2:#34d399}}
:root[data-theme=dark]{--bg:#0f172a;--sf:#1e293b;--bd:#334155;--tx:#e2e8f0;--mut:#94a3b8;--g:#6ee7b7;--g2:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit;user-select:text}
.hidden{display:none!important}
header{height:50px;min-height:50px;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;z-index:30}
header h1{font-size:16px;margin:0;white-space:nowrap}
.hb{height:34px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:13px}
.hb.on{background:var(--a);border-color:var(--a)}
.pill{font-size:12px;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:99px}
main{flex:1;display:flex;position:relative;overflow:hidden;min-height:0}
#map-section{flex:1;position:relative;overflow:hidden;background:#cbd5e1;min-width:0}
#map-viewport{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#map-viewport.draw{cursor:crosshair}
#layer{position:absolute;left:0;top:0;width:1281px;height:1117px;transform-origin:0 0;will-change:transform}
#layer img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
#svg{position:absolute;inset:0;width:100%;height:100%}
.poly{fill:#ffffff;fill-opacity:1;stroke:rgba(27,67,50,.75);stroke-width:1.8;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:all;transition:fill .15s,stroke .15s}
.poly.custom,.poly.custom.has{fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:2.2}
.poly:hover,.poly.has:hover,.poly.custom:hover,.poly.custom.has:hover,
.poly.touch-hit,.poly.custom.touch-hit{fill:#e8c49e!important;fill-opacity:1!important;stroke:#d97706!important;stroke-width:2.6!important}
.poly.sel,.poly.has.sel,.poly.custom.sel,.poly.custom.has.sel{fill:#dfb088!important;fill-opacity:1!important;stroke:#c2410c!important;stroke-width:3.5!important}
.adj .poly,.adj .poly.has{fill:#ffffff;fill-opacity:1;stroke:#dc2626;stroke-width:1}
.adj .poly.custom{fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1.6}
.adj .poly.sel{fill:#e8c49e!important;fill-opacity:1!important;stroke:#ea580c!important;stroke-width:1.5!important}
.fl{position:absolute;z-index:10;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hint{top:10px;left:10px;padding:7px 11px;font-size:12px;pointer-events:none}
#zoom{bottom:14px;left:10px;display:flex;flex-direction:column;padding:4px;gap:2px}
#zoom button{width:38px;height:38px;border:0;background:none;border-radius:8px;font-size:18px;font-weight:700;color:var(--tx)}
#zoom button:active{background:var(--bd)}
#draw-banner{top:10px;left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:9px 12px;display:flex;gap:10px;align-items:center;max-width:94%;font-size:12px;border:0}
#draw-banner button{border:0;border-radius:8px;padding:6px 10px;font-weight:700;background:#fff;color:#b45309}
#adj-panel{top:10px;right:10px;width:248px;padding:11px;font-size:12px;max-height:calc(100% - 20px);overflow:auto;z-index:20}
#adj-panel h3{margin:0 0 6px;font-size:13px}
#adj-panel .sec{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
#adj-panel .adj-fold-btn{display:none}

@media(max-width:767px){
  body.adj-active main{
    flex-direction:column;
  }
  body.adj-active #map-section{
    flex:1 1 auto;
    min-height:0;
  }
  body.adj-active #zoom{
    display:flex!important;
    bottom:8px;
    left:8px;
    transform:scale(0.88);
    transform-origin:bottom left;
  }
  #adj-panel.adj-mobile-dock{
    position:relative!important;
    top:auto!important;
    right:auto!important;
    left:auto!important;
    bottom:auto!important;
    width:100%!important;
    max-width:100%!important;
    max-height:none!important;
    height:auto!important;
    flex:0 0 auto;
    z-index:22;
    border-radius:12px 12px 0 0;
    border-left:0;
    border-right:0;
    border-bottom:0;
    border-top:1px solid var(--bd);
    box-shadow:0 -4px 16px rgba(0,0,0,.14);
    padding:8px 10px 10px;
    font-size:11px;
    overflow:visible;
  }
  #adj-panel.adj-mobile-dock .adj-fold-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:24px;
    padding:0 8px;
    border-radius:6px;
    border:1px solid var(--bd);
    background:var(--sf);
    font-size:11px;
    font-weight:700;
    color:var(--tx);
  }
  #adj-panel.adj-mobile-dock .adj-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
  }
  #adj-panel.adj-mobile-dock .adj-head h3{
    margin:0;
    font-size:12px;
  }
  #adj-panel.adj-mobile-dock .adj-subhint{
    margin-top:3px;
    font-size:10px;
    line-height:1.3;
  }
  #adj-panel.adj-mobile-dock .adj-ctrl-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:5px;
  }
  #adj-panel.adj-mobile-dock .adj-sections{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:6px;
    padding-top:6px;
    border-top:1px solid var(--bd);
  }
  #adj-panel.adj-mobile-dock .sec{
    border-top:0;
    padding-top:0;
    margin-top:0;
  }
  #adj-panel.adj-mobile-dock .sec h3{
    font-size:11px;
    margin:0 0 3px;
  }
  #adj-panel.adj-mobile-dock .row{
    gap:3px;
    margin:3px 0;
  }
  #adj-panel.adj-mobile-dock .ab{
    height:28px;
    font-size:11px;
    border-radius:6px;
  }
  #adj-panel.adj-mobile-dock .adj-sec-copy{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding-top:5px;
    border-top:1px dashed var(--bd);
  }
  #adj-panel.adj-mobile-dock .adj-sec-copy .row{
    margin:0;
    flex:0 0 auto;
  }
  #adj-panel.adj-mobile-dock .adj-sec-copy .ab.wide{
    height:26px;
    padding:0 10px;
  }
  #adj-panel.adj-mobile-dock.collapsed .adj-body{
    display:none!important;
  }
}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:5px 0}
.ab{height:34px;border:1px solid var(--bd);background:var(--bg);border-radius:8px;font-size:12px;font-weight:700;
